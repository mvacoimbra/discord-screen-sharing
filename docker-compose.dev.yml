# Desenvolvimento com o Hangar: `hangar up` sobe isto na máquina emprestada e
# traz a porta 3000 para o localhost daqui. Produção continua no
# docker-compose.yml.
name: discord-screen-sharing-dev

services:
  sala:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_PORT: 3100
      RELAY_PORT: 3101
      NEXT_TELEMETRY_DISABLED: 1
      # O Docker no Windows não avisa o contêiner quando um arquivo muda.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_node_modules:/app/app/node_modules
      - server_node_modules:/app/server/node_modules
      - next:/app/app/.next
      - npm-cache:/root/.npm

volumes:
  node_modules:
  app_node_modules:
  server_node_modules:
  next:
  npm-cache:
