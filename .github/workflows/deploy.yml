name: Build and deploy

# Build roda num runner do Hangar; a VPS só baixa a imagem e sobe.
# Kill switch: crie a variável de repositório DEPLOY_PAUSED=true para pular
# build, deploy e limpeza (as verificações continuam rodando).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mvacoimbra/discord-screen-sharing-sala
  PACKAGE: discord-screen-sharing-sala

jobs:
  check:
    runs-on: [self-hosted, hangar, Linux, X64, docker]
    timeout-minutes: 20
    env:
      # Cache do npm no disco do runner (nada de actions/cache pela internet).
      npm_config_cache: /opt/hangar-cache/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run types
      - run: npm run lint

  build:
    needs: check
    if: vars.DEPLOY_PAUSED != 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hangar, Linux, X64, docker]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Build no Docker local do runner: o cache de camadas fica na máquina.
      # O Dockerfile não tem ARG de build hoje. Se um dia tiver, passe o valor
      # com `--build-arg X="$X"` lendo de `vars.*`, nunca escrito aqui.
      - name: Build and push
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="${IMAGE}:${SHA}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${REPO}" \
            -t "$image" .
          # O GHCR às vezes responde "denied" com pacote novo e aceita depois.
          for attempt in 1 2 3 4 5; do
            docker push "$image" && break
            [ "$attempt" != 5 ] || { echo "Push still failing" >&2; exit 1; }
            sleep $((attempt * 15))
          done

  deploy:
    needs: build
    runs-on: [self-hosted, hangar, Linux]
    timeout-minutes: 5
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      UUID: ${{ vars.COOLIFY_APP_UUID }}
      SHA: ${{ github.sha }}
    steps:
      # Só chega aqui com a imagem já publicada. O Coolify apenas baixa.
      - name: Point Coolify at the new image and deploy
        run: |
          set -euo pipefail
          api="${COOLIFY_URL:-https://app.coolify.io}/api/v1"
          auth=(-H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Accept: application/json" -H "Content-Type: application/json")
          body=$(jq -nc --arg n "$IMAGE" --arg t "$SHA" '{docker_registry_image_name: $n, docker_registry_image_tag: $t}')
          curl -fsS --max-time 30 -X PATCH "${auth[@]}" -d "$body" "${api}/applications/${UUID}" > /dev/null
          response=$(curl -fsS --max-time 30 -X POST "${auth[@]}" -d "$(jq -nc --arg u "$UUID" '{uuid: $u, force: false}')" "${api}/deploy")
          echo "$response" | jq -e '.deployments[0].deployment_uuid' > /dev/null
          echo "Deploy requested for ${IMAGE}:${SHA}"

  prune:
    name: Prune old images
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: [self-hosted, hangar, Linux]
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      KEEP: "5"
    steps:
      - run: |
          set -uo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          # Versões vêm da mais nova para a mais velha. Só apaga versão COM tag
          # além das KEEP últimas. Nunca apague versão sem tag: a imagem é um
          # índice e as partes internas aparecem sem tag; apagá-las deixa a tag
          # vazia e a VPS falha com "manifest unknown".
          ids=$(gh api --paginate "users/${owner}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[] | [.id, ((.metadata.container.tags // []) | join(","))] | @tsv' 2>/dev/null || true)
          [ -n "$ids" ] || exit 0
          kept=0
          while IFS=$'\t' read -r id tags; do
            [ -n "$tags" ] || continue
            kept=$((kept + 1))
            [ "$kept" -gt "$KEEP" ] || continue
            echo "Deleting version ${id} (${tags})"
            gh api -X DELETE "users/${owner}/packages/container/${PACKAGE}/versions/${id}" > /dev/null 2>&1 \
              || echo "Could not delete ${id}" >&2
          done <<< "$ids"
