name: Build and deploy

# Build roda num runner do Hangar; a VPS só baixa a imagem e sobe.
# Kill switch: crie a variável de repositório DEPLOY_PAUSED=true para pular
# build, push e deploy (as verificações continuam rodando).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mvacoimbra/discord-screen-sharing-sala
  PACKAGE: discord-screen-sharing-sala
  KEEP_IMAGES: "5"

jobs:
  check:
    runs-on: [self-hosted, hangar, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run lint

  build-deploy:
    needs: check
    if: vars.DEPLOY_PAUSED != 'true'
    runs-on: [self-hosted, hangar, Linux, X64, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      # Build no Docker local do runner: o cache de camadas fica na máquina.
      # O Dockerfile não tem ARG de build hoje. Se um dia tiver, passe o valor
      # com `--build-arg X="$X"` lendo de `vars.*`, nunca escrito aqui.
      # O label de origem liga o pacote ao repositório (permite o prune).
      - name: Build and push image
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.revision=$SHA" \
            -t "$IMAGE:$SHA" .
          docker push "$IMAGE:$SHA"

      # Só chega aqui com a imagem já publicada. O Coolify apenas baixa.
      - name: Point Coolify at the new image and deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="${COOLIFY_URL:-https://app.coolify.io/api/v1}"
          auth="Authorization: Bearer ${COOLIFY_TOKEN}"
          curl -fsS -X PATCH "$api/applications/$COOLIFY_APP_UUID" \
            -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg n "$IMAGE" --arg t "$SHA" \
              '{docker_registry_image_name:$n, docker_registry_image_tag:$t}')" \
            -o /dev/null
          curl -fsS -X POST "$api/deploy" \
            -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg u "$COOLIFY_APP_UUID" '{uuid:$u, force:false}')" \
            -o /dev/null
          echo "Deploy requested for $IMAGE:$SHA"

      - name: Prune old images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api --paginate "/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100" |
            jq -r -s --argjson keep "$KEEP_IMAGES" \
              'add | sort_by(.created_at) | reverse | .[$keep:] | .[].id' |
            while read -r id; do
              echo "Deleting version $id"
              gh api -X DELETE "/users/$OWNER/packages/container/$PACKAGE/versions/$id"
            done
